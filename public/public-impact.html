<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impact Profile | VolunteerSkill</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg vs-navbar py-3">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="index.html"><i class="fas fa-hands-helping me-2"></i>VolunteerSkill</a>
  </div>
</nav>
<div class="container mt-5 mb-5" style="max-width:800px;">
  <div id="wrap"><div class="spinner-wrap"><div class="spinner-border text-success"></div></div></div>
</div>
<script src="js/api.js"></script>
<script>
async function load() {
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) { document.getElementById('wrap').innerHTML = '<div class="alert alert-danger">Missing share token.</div>'; return; }
  try {
    const res = await fetch(`/api/public/impact/${token}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Not found');
    const impact = data.impact;
    document.getElementById('wrap').innerHTML = `
      <div class="text-center mb-4">
        <h2 class="fw-bold">${impact.name}'s Impact Profile</h2>
        <p class="text-muted">Shared via VolunteerSkill — Connect Skills. Create Impact.</p>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-value">${impact.completedEventsCount}</div><div class="stat-label">Events</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-value">${impact.totalHours}</div><div class="stat-label">Hours</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-value">${impact.certificates.length}</div><div class="stat-label">Certificates</div></div></div>
        <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-value">${impact.badges.length}</div><div class="stat-label">Badges</div></div></div>
      </div>
      <h6 class="fw-bold mb-2">Skills Used</h6>
      <div class="mb-4">${impact.skillsUsed.map(s => `<span class="skill-chip">${s}</span>`).join('') || '<span class="text-muted small">None yet</span>'}</div>
      <h6 class="fw-bold mb-2">Badges Earned</h6>
      <div class="row g-2 mb-4">${impact.badges.map(b => `<div class="col-6 col-md-4"><div class="card card-vs p-2 text-center"><i class="fas ${b.icon} text-success mb-1"></i><div class="small fw-bold">${b.label}</div></div></div>`).join('') || '<p class="text-muted small">No badges yet</p>'}</div>
      <h6 class="fw-bold mb-2">Contribution History</h6>
      <div class="table-responsive"><table class="table table-sm">
        <thead><tr><th>Event</th><th>NGO</th><th>Date</th></tr></thead>
        <tbody>${impact.completedEvents.map(e => `<tr><td>${e.title}</td><td>${e.ngoName}</td><td>${VS.fmtDate(e.date)}</td></tr>`).join('') || '<tr><td colspan="3" class="text-muted text-center">No completed events yet</td></tr>'}</tbody>
      </table></div>
    `;
  } catch (err) {
    document.getElementById('wrap').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
  }
}
load();
</script>
</body>
</html>
