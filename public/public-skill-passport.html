<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Passport | VolunteerSkill</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg vs-navbar py-3">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="index.html"><i class="fas fa-hands-helping me-2"></i>VolunteerSkill</a>
  </div>
</nav>
<div class="container mt-5 mb-5" style="max-width:800px;">
  <div id="wrap"><div class="spinner-wrap"><div class="spinner-border text-success"></div></div></div>
</div>
<script src="js/api.js"></script>
<script>
async function load() {
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) { document.getElementById('wrap').innerHTML = '<div class="alert alert-danger">Missing share token.</div>'; return; }
  try {
    const res = await fetch(`/api/public/skill-passport/${token}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Not found');
    const p = data.passport;
    document.getElementById('wrap').innerHTML = `
      <div class="text-center mb-4">
        <h2 class="fw-bold"><i class="fas fa-id-badge me-2 text-success"></i>${p.volunteerName}'s Skill Passport</h2>
        <p class="text-muted">Verified through real volunteering activity on VolunteerSkill</p>
      </div>
      <div class="row g-3">
        ${p.skills.map(s => `
          <div class="col-md-6">
            <div class="passport-card">
              <h6 class="fw-bold mb-1">${s.skill} <span class="badge badge-verified ms-1"><i class="fas fa-check me-1"></i>Verified</span></h6>
              <p class="small text-muted mb-1">Level: ${s.level} · ${s.totalHours} hour(s)</p>
              <p class="small mb-1"><strong>Demonstrated in:</strong> ${s.projects.join(', ')}</p>
              ${s.certificates.length ? `<p class="small mb-0"><strong>Certificates:</strong> ${s.certificates.map(c=>c.code).join(', ')}</p>` : ''}
            </div>
          </div>`).join('') || '<div class="col-12"><div class="alert alert-light border text-center py-4">No verified skills yet.</div></div>'}
      </div>
    `;
  } catch (err) {
    document.getElementById('wrap').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
  }
}
load();
</script>
</body>
</html>
