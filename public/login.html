<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | VolunteerSkill</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg vs-navbar py-3">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="fas fa-hands-helping me-2"></i>VolunteerSkill</a>
  </div>
</nav>

<div class="container">
  <div class="card auth-card" style="max-width: 460px;">
    <div class="auth-header">
      <i class="fas fa-sign-in-alt fa-2x mb-2"></i>
      <h4 class="mb-0">Welcome Back</h4>
      <p class="mb-0 small">Login to your VolunteerSkill account.</p>
    </div>
    <div class="card-body p-4">
      <div id="alertBox"></div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <button type="submit" class="btn btn-vs-primary w-100 py-2" id="submitBtn">
          <i class="fas fa-sign-in-alt me-2"></i>Login
        </button>
      </form>
      <div class="text-center mt-4">
        <p class="small text-muted mb-1">New here?</p>
        <a href="register-volunteer.html" class="small me-3">Register as Volunteer</a>
        <a href="register-ngo.html" class="small">Register as NGO</a>
      </div>
      <hr>
      <div class="small text-muted text-center">
        <i class="fas fa-user-shield me-1"></i>Admin demo login: <strong>admin@volunteerskill.org</strong> / <strong>admin123</strong>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';

  const form = e.target;
  try {
    const data = await VS.post('/auth/login', { email: form.email.value, password: form.password.value });
    VS.setSession(data.token, data.role, data.user);
    VS.toast('Login successful! Redirecting...', 'success');
    setTimeout(() => window.location.href = VS.dashboardForRole(data.role), 600);
  } catch (err) {
    document.getElementById('alertBox').innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Login';
  }
});
</script>
</body>
</html>
